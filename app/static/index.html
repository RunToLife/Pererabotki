<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переработка</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">ПР</span>
        <div><strong>Переработка</strong><small>учёт часов</small></div>
      </div>
      <nav id="tabs" class="nav" aria-label="Разделы">
        <button data-tab="schedule" class="active"><span class="idx">01</span>График дежурств</button>
        <button data-tab="dayoffs"><span class="idx">02</span>График отгулов</button>
        <button data-tab="official"><span class="idx">03</span>Официальные часы</button>
        <button data-tab="unofficial"><span class="idx">04</span>Неофициальные часы</button>
        <button data-tab="employees"><span class="idx">05</span>Дежурные</button>
        <button data-tab="audit"><span class="idx">06</span>Аудит</button>
        <button data-tab="analytics"><span class="idx">07</span>Аналитика</button>
      </nav>
      <div id="user" class="user" title="Учётная запись, под которой вы подключились"></div>
    </aside>

    <div class="content">
      <header class="pagehead">
        <div>
          <p class="eyebrow" id="eyebrow">Раздел</p>
          <h1 id="title">График дежурств</h1>
        </div>
        <div id="monthbar" class="monthbar">
          <button id="prev" class="btn sq" title="Предыдущий месяц" aria-label="Предыдущий месяц">‹</button>
          <input type="month" id="month" aria-label="Месяц">
          <button id="next" class="btn sq" title="Следующий месяц" aria-label="Следующий месяц">›</button>
          <button id="today" class="btn">Текущий месяц</button>
          <select id="history" title="Месяцы, за которые есть данные" aria-label="Месяцы с данными"></select>
        </div>
      </header>
      <section id="view"></section>
    </div>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="dialog"></dialog>
  <script src="/static/app.js"></script>
</body>
</html>
